name: 0. Tạo keystore (chạy 1 lần)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Mật khẩu keystore (tự đặt, nhớ kỹ)"
        required: true
      key_alias:
        description: "Tên alias (tự đặt, vd: mykey)"
        required: true
        default: "mykey"
      key_password:
        description: "Mật khẩu key (tự đặt, có thể giống mật khẩu keystore)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo file keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=WebViewApp, OU=Dev, O=Dev, L=HCM, S=HCM, C=VN"

      - name: In ra chuỗi base64 để copy vào Secret KEYSTORE_BASE64
        run: |
          echo "## Copy đoạn dưới đây (toàn bộ, không thiếu ký tự nào)" >> "$GITHUB_STEP_SUMMARY"
          echo "## vào GitHub Secret có tên: KEYSTORE_BASE64" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          base64 -w0 release.keystore >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Các secret khác cần thêm:" >> "$GITHUB_STEP_SUMMARY"
          echo "- KEYSTORE_PASSWORD = giá trị bạn vừa nhập ở keystore_password" >> "$GITHUB_STEP_SUMMARY"
          echo "- KEY_ALIAS = ${{ github.event.inputs.key_alias }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- KEY_PASSWORD = giá trị bạn vừa nhập ở key_password" >> "$GITHUB_STEP_SUMMARY"
