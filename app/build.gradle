plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.webviewapp'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Lấy thông tin từ biến môi trường do GitHub Actions truyền vào
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "debug.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions = ["account"]

    // ============================================================
    // MỖI FLAVOR = 1 APK RIÊNG, applicationId khác nhau
    // => cài song song trên cùng máy không xung đột.
    // Link tab đọc từ app/src/<tên flavor>/assets/links.txt
    // Thêm tài khoản mới: copy 1 block bên dưới, đổi tên + applicationId,
    // rồi tạo file app/src/<tenFlavorMoi>/assets/links.txt
    // ============================================================
    productFlavors {
        accountA {
            dimension "account"
            applicationId "com.mapdes.webviewapp"
            resValue "string", "app_name", "Mapdes"
        }
        accountB {
            dimension "account"
            applicationId "com.lobbinity.webviewapp"
            resValue "string", "app_name", "Lobbinity"
        }
        accountC {
            dimension "account"
            applicationId "com.batphamtv.webviewapp"
            resValue "string", "app_name", "Bất Phàm TV"
        }
        accountD {
            dimension "account"
            applicationId "com.uabeweb.webviewapp"
            resValue "string", "app_name", "UABE Web"
        }
    }

    buildFeatures {
        viewBinding true
    }

    applicationVariants.all { variant ->
        // ĐẶT TÊN APK RIÊNG CHO TỪNG APP Ở ĐÂY:
        // key = tên flavor (đúng như khai báo trong productFlavors)
        // value = tên file mong muốn (không cần đuôi .apk)
        def apkNames = [
            accountA: "Mapdes",
            accountB: "Lobbinity",
            accountC: "Bất Phàm TV",
            accountD: "UABE Web"
            // accountC: "TenAppC",   <-- thêm flavor mới thì thêm 1 dòng ở đây
        ]
        variant.outputs.all { output ->
            def customName = apkNames[variant.flavorName] ?: variant.flavorName
            outputFileName = "${customName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
